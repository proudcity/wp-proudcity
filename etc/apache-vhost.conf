<VirtualHost *:8080>
	#ServerName www.example.com
	#ServerAdmin webmaster@localhost
	DocumentRoot /app/wordpress
	Header always unset X-Powered-By
	Header always set X-Content-Type-Options "nosniff"
	Header always set X-Frame-Options "SAMEORIGIN"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set X-XSS-Protection "1; mode=block"
	Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	LogLevel emerg

  #	ErrorLog ${APACHE_LOG_DIR}/error.log
  #	CustomLog ${APACHE_LOG_DIR}/access.log combined

  <Directory /app/wordpress/>
  	Options Indexes FollowSymLinks
  	AllowOverride All
  	Require all granted
  	LogLevel emerg

		<IfModule mod_rewrite.c>
			RewriteEngine On
			RewriteBase /

			RewriteRule ^index\.php$ - [L]
			RewriteCond %{REQUEST_FILENAME} !-f
			RewriteCond %{REQUEST_FILENAME} !-d
			RewriteRule . /index.php [L]

		</IfModule>


		# BEGIN W3TC Browser Cache
		<IfModule mod_deflate.c>
		    <IfModule mod_headers.c>
		        Header append Vary User-Agent env=!dont-vary
		    </IfModule>
		    <IfModule mod_filter.c>
		        AddOutputFilterByType DEFLATE text/css text/x-component application/x-javascript application/javascript text/javascript text/x-js text/html text/richtext image/svg+xml text/plain text/xsd text/xsl text/xml image/x-icon application/json
		    <IfModule mod_mime.c>
		        # DEFLATE by extension
		        AddOutputFilter DEFLATE js css htm html xml
		    </IfModule>
		    </IfModule>
		</IfModule>
		# END W3TC Browser Cache


  </Directory>

	# For most configuration files from conf-available/, which are
	# enabled or disabled at a global level, it is possible to
	# include a line for only one particular virtual host. For example the
	# following line enables the CGI configuration for this host only
	# after it has been globally disabled with "a2disconf".
	#Include conf-available/serve-cgi-bin.conf

</VirtualHost>

# MaxRequestWorkers is sized to the pod's cgroup memory limit at container
# start by bin/apache-workers.sh, which exports APACHE_MAX_REQUEST_WORKERS
# before Apache parses this file. Apache expands ${VAR} from its environment
# at config parse time, the same pattern etc/php.ini already uses for
# ${PHP_MEMORY_LIMIT}. ServerLimit matches MaxRequestWorkers; there is no
# reason for it to be higher. See wp-proudcity#2980.
<IfModule mpm_prefork_module>
		StartServers              4
		MinSpareServers           4
		MaxSpareServers           8
		ServerLimit               ${APACHE_MAX_REQUEST_WORKERS}
		MaxRequestWorkers         ${APACHE_MAX_REQUEST_WORKERS}
		MaxConnectionsPerChild    1000
</IfModule>

# Matches the ingress proxy-read-timeout default (60s). After that nginx has
# already given up on the request, so holding an Apache worker open for up
# to the previous 300s was pure waste. Timeout is an I/O timeout -- it does
# NOT stop a request that's actively running PHP. max_execution_time (30s)
# doesn't bound that either: on Linux it counts CPU time only, not time
# blocked on MySQL, Redis or an outbound HTTP call, so a worker can still be
# held well past either number. The actual trade-off here is 502/504
# responses under saturation instead of an OOM kill -- a held worker costs
# one fewer worker for other requests, not a dead pod.
Timeout 60

# Debian's default KeepAliveTimeout (5s) can hold a worker open on an idle
# nginx upstream keepalive connection for that whole window. That's a bigger
# share of capacity now that pools are as small as 7-14 workers (see
# bin/apache-workers.sh) than it was against the old fixed 1500. KeepAlive
# itself stays On; only the timeout drops.
KeepAliveTimeout 2

